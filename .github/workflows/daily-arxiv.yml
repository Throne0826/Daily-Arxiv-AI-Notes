name: Daily arXiv notes

on:
  workflow_dispatch:
  schedule:
    # 11:30 Asia/Shanghai, Monday through Friday.
    - cron: "30 3 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-arxiv
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[site,test]"
      - run: pytest
      - name: Fetch, classify, and draft notes
        env:
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.LLM_BASE_URL }}
          OPENAI_MODEL: ${{ vars.LLM_MODEL }}
          ARXIV_CONTACT_EMAIL: ${{ vars.ARXIV_CONTACT_EMAIL }}
        run: arxiv-notes --config config.toml run --date latest --require-llm
      - run: arxiv-notes --config config.toml validate
      - run: mkdocs build --strict
      - name: Commit generated drafts
        run: |
          git config user.name "daily-arxiv-notes[bot]"
          git config user.email "daily-arxiv-notes[bot]@users.noreply.github.com"
          git add docs/arxiv_daily docs/categories docs/review data/state.json data/review_queue.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "docs: add daily arXiv notes"
          git push
